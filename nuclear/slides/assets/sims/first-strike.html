<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-Strike Calculator</title>
<style>
  :root { --bg:#fafafa; --fg:#23373b; --muted:#6b7b7e; --a:#be3c32; --b:#285aa0; --line:#d8dddd; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 "Fira Sans", system-ui, sans-serif; }
  header { background:var(--fg); color:#fff; padding:14px 24px; font-size:20px; }
  main { max-width:1000px; margin:0 auto; padding:20px 16px 40px; display:grid; grid-template-columns: 320px 1fr; gap:28px; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  .ctl { margin-bottom:18px; }
  .ctl label { display:flex; justify-content:space-between; font-size:14px; }
  .ctl output { font-weight:600; }
  .ctl small { color:var(--muted); display:block; font-size:12px; margin-top:2px; }
  input[type=range] { width:100%; accent-color: var(--fg); }
  .side { font-weight:600; }
  .A { color:var(--a); } .B { color:var(--b); }
  svg { width:100%; height:auto; display:block; }
  #verdict { font-size:22px; margin:8px 0 4px; }
  #detail { color:var(--muted); font-size:14px; }
  .presets button { font:inherit; font-size:13px; margin:0 6px 6px 0; padding:4px 10px; border:1px solid var(--line); background:#fff; border-radius:4px; cursor:pointer; }
  .presets button:hover { border-color:var(--fg); }
</style>
</head>
<body>
<header>First-strike calculator: <span class="A">Red</span> strikes <span class="B">Blue</span>'s missile silos first</header>
<main>
  <section>
    <div class="presets">
      <button data-k="1"  data-sea="0">One warhead per missile</button>
      <button data-k="10" data-sea="0">MIRV: 10 per missile</button>
      <button data-k="10" data-sea="50">MIRV + half at sea</button>
    </div>
    <div class="ctl"><label>Missiles per side <output id="oN"></output></label>
      <input id="N" type="range" min="10" max="1000" step="10" value="100"></div>
    <div class="ctl"><label>Warheads per missile <output id="ok"></output></label>
      <input id="k" type="range" min="1" max="12" step="1" value="1"><small>More than 1 = MIRV</small></div>
    <div class="ctl"><label>Warheads aimed at each silo <output id="ow"></output></label>
      <input id="w" type="range" min="1" max="3" step="1" value="2"><small>Planners usually assume 2 to be sure</small></div>
    <div class="ctl"><label>Chance one warhead destroys a silo <output id="op"></output></label>
      <input id="p" type="range" min="0.3" max="0.99" step="0.01" value="0.7"><small>Accuracy vs. how hardened the silo is</small></div>
    <div class="ctl"><label>Blue's missiles on submarines <output id="osea"></output></label>
      <input id="sea" type="range" min="0" max="100" step="5" value="0"><small>Submarines can't be targeted</small></div>
  </section>
  <section>
    <div id="verdict"></div>
    <div id="detail"></div>
    <svg id="chart" viewBox="0 0 600 330" role="img" aria-label="Warheads before and after the first strike"></svg>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const ids = ["N","k","w","p","sea"];
function fmt(x){ return Math.round(x).toLocaleString(); }

function compute(){
  const N=+$("N").value, k=+$("k").value, w=+$("w").value, p=+$("p").value, sea=+$("sea").value/100;
  const blueSilos = N*(1-sea), blueSea = N*sea;
  // Red uses as many of its own missiles as needed (all of them if necessary) to put w warheads on each Blue silo.
  const redWarheads = N*k;
  const targeted = Math.min(blueSilos, Math.floor(redWarheads / w));
  const missilesUsed = Math.min(N, Math.ceil(targeted*w / k));
  const surviveEach = Math.pow(1-p, w);
  const blueSiloLeft = (blueSilos - targeted) + targeted*surviveEach;
  return {
    N,k,w,p,sea,
    redBefore: N*k, blueBefore: N*k,
    redAfter: (N - missilesUsed)*k,
    blueAfter: (blueSiloLeft + blueSea)*k,
    missilesUsed, targeted, blueSilos
  };
}

function bar(svg, x, y, h, maxV, v, color, label){
  const W = 420*Math.max(0, v)/maxV;
  svg.insertAdjacentHTML("beforeend",
    `<rect x="${x}" y="${y}" width="${Math.max(W,1.5)}" height="${h}" fill="${color}" rx="2"/>` +
    `<text x="${x+W+8}" y="${y+h/2+5}" font-size="15" fill="#23373b">${fmt(v)}</text>` +
    `<text x="${x-10}" y="${y+h/2+5}" font-size="14" text-anchor="end" fill="${color}" font-weight="600">${label}</text>`);
}

function render(){
  ids.forEach(i=>{ const v=$(i).value; $("o"+i).textContent = i==="p" ? Math.round(v*100)+"%" : i==="sea" ? v+"%" : v; });
  const r = compute();
  const svg = $("chart"); svg.innerHTML = "";
  const maxV = Math.max(r.redBefore, r.blueBefore, 1);
  svg.insertAdjacentHTML("beforeend", `<text x="0" y="22" font-size="15" fill="#6b7b7e">Warheads before</text>`);
  bar(svg, 90, 36, 34, maxV, r.redBefore, "#be3c32", "Red");
  bar(svg, 90, 78, 34, maxV, r.blueBefore, "#285aa0", "Blue");
  svg.insertAdjacentHTML("beforeend", `<line x1="0" x2="600" y1="140" y2="140" stroke="#d8dddd"/>`);
  svg.insertAdjacentHTML("beforeend", `<text x="0" y="178" font-size="15" fill="#6b7b7e">Warheads after Red strikes first</text>`);
  bar(svg, 90, 192, 34, maxV, r.redAfter, "#be3c32", "Red");
  bar(svg, 90, 234, 34, maxV, r.blueAfter, "#285aa0", "Blue");
  const ratioBefore = 1, ratioAfter = r.blueAfter>0 ? r.redAfter/r.blueAfter : Infinity;
  const pays = ratioAfter > ratioBefore;
  $("verdict").innerHTML = pays
    ? `Striking first <b class="A">pays</b>: Red ends up ${ratioAfter===Infinity?"with everything":"ahead "+ratioAfter.toFixed(1)+" to 1"}.`
    : `Striking first <b class="B">doesn't pay</b>: Red ends up behind ${(1/Math.max(ratioAfter,1e-9)).toFixed(1)} to 1.`;
  $("detail").textContent =
    `Red fires ${fmt(r.missilesUsed)} of its ${fmt(r.N)} missiles at ${fmt(r.targeted)} of Blue's ${fmt(r.blueSilos)} silos. ` +
    `Each targeted silo survives with probability ${(Math.pow(1-r.p,r.w)*100).toFixed(1)}%. ` +
    `Blue can still retaliate with ${fmt(r.blueAfter)} warheads` +
    (r.blueAfter >= 50 ? ", which is enough to destroy Red's cities." : ".");
}

ids.forEach(i => $(i).addEventListener("input", render));
document.querySelectorAll(".presets button").forEach(b => b.addEventListener("click", () => {
  $("k").value = b.dataset.k; $("sea").value = b.dataset.sea; $("w").value = 2; $("p").value = 0.7; $("N").value = 100; render();
}));
render();
</script>
</body>
</html>
